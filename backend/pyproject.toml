[project]
name = "fireflies-clone-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/File() defaults are idiomatic
    "SIM905",  # whitespace-split word lists read better than huge list literals
]

[tool.pytest.ini_options]
testpaths = ["tests"]
