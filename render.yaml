# Render Blueprint for the FastAPI backend (the Next.js frontend deploys to Vercel).
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are
# prompted for during setup and never stored in git.
services:
  - type: web
    name: fireflies-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Seed the demo data on first boot only, then serve.
    startCommand: python -m app.seed.seed --if-empty && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Free instances have no persistent disk, so the SQLite file resets to the seeded demo
      # data on each restart or deploy. To keep data, switch to a paid plan, uncomment the
      # disk below and use: sqlite:////var/data/fireflies.db
      - key: DATABASE_URL
        value: sqlite:///./fireflies.db
      # JSON list with the Vercel URL, e.g. ["https://fireflies-clone.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Also allow this project's Vercel preview deployments.
      - key: CORS_ORIGIN_REGEX
        value: https://fireflies-clone[a-z0-9-]*\.vercel\.app
      # AI: Groq's OpenAI-compatible API. Set LLM_PROVIDER to "none" to run fully offline.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: LLM_REQUESTS_PER_HOUR_PER_CLIENT
        value: "20"
      - key: LLM_REQUESTS_PER_DAY
        value: "300"
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
